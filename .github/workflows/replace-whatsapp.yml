name: One-Time WhatsApp Number Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-whatsapp.yml'

permissions:
  contents: write

jobs:
  replace-number:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace old number and normalize WhatsApp/schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              '+92 332 2908556': '+92 333 1127834',
              '+923322908556': '+923331127834',
              '923322908556': '923331127834',
              '0332 2908556': '0333 1127834',
              '0332-2908556': '0333-1127834',
              '03322908556': '03331127834',
          }

          targets = []
          targets.extend(p for p in Path('src').rglob('*') if p.is_file())
          targets.extend(p for p in Path('public').rglob('*') if p.is_file())
          if Path('index.html').exists():
              targets.append(Path('index.html'))

          changed = []
          for path in targets:
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)

              if path.suffix.lower() in {'.js', '.jsx', '.ts', '.tsx'}:
                  text = re.sub(r"telephone:\s*(?:displayPhone|'[^']*'|\"[^\"]*\")", "telephone: '+92 333 1127834'", text)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          service = Path('src/components/Pages/Services/ServicesLayout.jsx')
          if service.exists():
              text = service.read_text(encoding='utf-8')
              original = text
              text = text.replace("const waNumber = phone.replace(/\\D/g, '');", "const waNumber = '923331127834';")
              text = text.replace("telephone: displayPhone,", "telephone: '+92 333 1127834',")
              if text != original:
                  service.write_text(text, encoding='utf-8')
                  if str(service) not in changed:
                      changed.append(str(service))

          online = Path('src/components/Pages/OnlineNikahCityLayout.jsx')
          if online.exists():
              text = online.read_text(encoding='utf-8')
              original = text
              text = text.replace("const waUrl = `https://wa.me/${phone.replace(/\\D/g, '')}?text=${waMessage}`;", "const waUrl = `https://wa.me/923331127834?text=${waMessage}`;")
              text = text.replace("telephone: displayPhone,", "telephone: '+92 333 1127834',")
              if text != original:
                  online.write_text(text, encoding='utf-8')
                  if str(online) not in changed:
                      changed.append(str(online))

          print('Changed files:')
          for item in changed:
              print('-', item)

          obsolete = ['+92 332 2908556', '+923322908556', '923322908556', '0332 2908556', '0332-2908556', '03322908556']
          leftovers = []
          for path in targets:
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for old in obsolete:
                  if old in text:
                      leftovers.append(f'{path}: {old}')
          if leftovers:
              raise SystemExit('Obsolete number remains:\n' + '\n'.join(leftovers))
          PY

      - name: Commit cleanup
        run: |
          if git diff --quiet -- src public index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public index.html
          git commit -m "Use 0333 1127834 as universal WhatsApp number"
          git push
